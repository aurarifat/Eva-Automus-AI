name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to generate'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Bootstrapping Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
            chmod +x ./gradlew
          fi

      - name: Prepare Keystores
        run: |
          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring debug keystore from base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./my-upload-key.jks" ] && [ -z "${KEYSTORE_PATH:-}" ]; then
            echo "Generating fallback release keystore..."
            keytool -genkey -v \
              -keystore ./my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=EVA AI Release,O=EVA,C=US"
          fi

      - name: Build APK(s)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'both' }}
        run: |
          if [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
          if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "Building Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build completed with notice."
          fi

      - name: Package Release Assets
        id: package_assets
        run: |
          ASSET_DIR="${RUNNER_TEMP:-/tmp}/manual_apk_release_assets"
          mkdir -p "$ASSET_DIR"

          DEBUG_APK=$(find app/build/outputs/apk/debug .build-outputs -name "*debug*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -s "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "$ASSET_DIR/EVA-AI-v1.0-debug.apk"
          fi

          RELEASE_APK=$(find app/build/outputs/apk/release app/build/outputs/apk -name "*release*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -s "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "$ASSET_DIR/EVA-AI-v1.0-release.apk"
          fi

          cd "$ASSET_DIR"
          if ls *.apk 1>/dev/null 2>&1; then
            sha256sum *.apk > SHA256SUMS.txt
          fi
          cd - > /dev/null

          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"
          ls -lh "$ASSET_DIR"

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks-manual-${{ github.run_number }}
          path: ${{ steps.package_assets.outputs.asset_dir }}/*
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v1.0-manual-build-${{ github.run_number }}"
          RELEASE_TITLE="EVA AI v1.0 (Manual Build #${{ github.run_number }})"
          ASSETS_DIR="${{ steps.package_assets.outputs.asset_dir }}"

          ASSET_ARGS=()
          for asset in "$ASSETS_DIR"/*; do
            if [ -f "$asset" ]; then
              ASSET_ARGS+=("$asset")
            fi
          done

          cat << 'EOF' > release_notes.md
          # EVA AI — Manual Build Release

          Automated build triggered manually via GitHub Actions workflow dispatch.

          ## 📦 Assets Included
          - Android APK files
          - SHA-256 Checksums (`SHA256SUMS.txt`)
          - Full Source Code (`.zip`, `.tar.gz`)
          EOF

          gh release create "$RELEASE_TAG" "${ASSET_ARGS[@]}" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest
